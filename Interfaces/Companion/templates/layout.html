<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · Genesis Companion</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-environment="$environment">
  <a class="skip-link" href="#main-content">Saltar para o conteúdo</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Genesis">
      <a class="brand" href="/"><span class="brand-mark">G</span>
        <span><strong>$system_name</strong><small>Intelligence OS</small></span></a>
      <nav aria-label="Navegação principal">$sidebar</nav>
      <div class="sidebar-status"><span class="$health_class"></span>
        <div><strong>Genesis $version</strong><small>Ambiente: $environment</small></div>
      </div>
    </aside>
    <main class="main-content" id="main-content">
      <header class="topbar" aria-labelledby="page-title">
        <div class="page-heading"><span class="eyebrow">$context_label</span>
          <h1 id="page-title">$page_title</h1><p>$page_subtitle</p></div>
        <div class="header-actions">$page_action</div>
        <div class="header-context" aria-label="Contexto da aplicação">
          <div><small>Workspace ativo</small><strong>$active_workspace</strong></div>
          <div><small>Modo</small><strong>$storage_mode</strong></div>
          <div><small>Versão</small><strong>Genesis $version</strong></div>
          <div class="services-indicator"><span class="$health_class"></span>
            <small>Serviços disponíveis</small><strong>$services_available</strong></div>
        </div>
      </header>
      <div class="page-content" aria-live="polite">$content</div>
    </main>
  </div>
</body>
</html>
