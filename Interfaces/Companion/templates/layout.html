<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · Genesis Companion</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="brand-mark">G</span>
        <span><strong>$system_name</strong><small>Intelligence OS</small></span></a>
      <nav>$sidebar</nav>
      <div class="sidebar-status"><span class="status-light"></span>
        <div><strong>Genesis local</strong><small>v$version · Ambiente: $environment</small></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><span class="eyebrow">Genesis Companion</span>
          <h1>$page_title</h1><p>$page_subtitle</p></div>
        <div class="local-badge"><span></span> Ambiente local</div>
      </header>
      <div class="page-content">$content</div>
    </main>
  </div>
</body>
</html>
